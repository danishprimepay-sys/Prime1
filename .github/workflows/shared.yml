name: shared

on:
  push:
    paths: ["shared/**", "reference/**", "ml/**", ".github/workflows/shared.yml"]
  pull_request:
    paths: ["shared/**", "reference/**", "ml/**", ".github/workflows/shared.yml"]

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test vectors match the reference engine
        run: python3 reference/make_vectors.py --check
