# XcodeGen spec: `brew install xcodegen && xcodegen` (run in ios/) generates
# SpamShield.xcodeproj, which is not checked in.
name: SpamShield

options:
  bundleIdPrefix: com.spamshield
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team here (or in Xcode) to run on a device.
    DEVELOPMENT_TEAM: ""

packages:
  SpamShieldCore:
    path: SpamShieldCore

targets:
  SpamShield:
    type: application
    platform: iOS
    sources:
      - path: SpamShield/App
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: SpamShield
        PRODUCT_BUNDLE_IDENTIFIER: com.spamshield.ios
        INFOPLIST_FILE: SpamShield/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpamShield/App/SpamShield.entitlements
    dependencies:
      - package: SpamShieldCore
        product: SpamShieldCore
      # App extensions are embedded into the app's PlugIns folder.
      - target: CallDirectory
      - target: MessageFilter

  CallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - path: SpamShield/CallDirectory
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: CallDirectory
        PRODUCT_BUNDLE_IDENTIFIER: com.spamshield.ios.CallDirectory
        INFOPLIST_FILE: SpamShield/CallDirectory/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpamShield/CallDirectory/CallDirectory.entitlements
    dependencies:
      - package: SpamShieldCore
        product: SpamShieldCore

  MessageFilter:
    type: app-extension
    platform: iOS
    sources:
      - path: SpamShield/MessageFilter
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: MessageFilter
        PRODUCT_BUNDLE_IDENTIFIER: com.spamshield.ios.MessageFilter
        INFOPLIST_FILE: SpamShield/MessageFilter/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpamShield/MessageFilter/MessageFilter.entitlements
    dependencies:
      - package: SpamShieldCore
        product: SpamShieldCore

schemes:
  SpamShield:
    build:
      targets:
        SpamShield: all
        CallDirectory: all
        MessageFilter: all
    run:
      config: Debug
      executable: SpamShield
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
